<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Byt sida</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f4f1;color:#171717}
body{display:flex;justify-content:center;align-items:center;padding:18px 10px}
.wrap{width:min(760px,97vw);text-align:center}
h1{font-size:clamp(30px,7vw,46px);margin:0 0 4px}
.sub{font-size:clamp(16px,4vw,21px);color:#696969;margin:0 0 14px}
.card{background:#fff;border-radius:24px;padding:6px;box-shadow:0 12px 36px rgba(0,0,0,.08)}
svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.board{fill:#fafafa;stroke:#171717;stroke-width:7;stroke-linejoin:round}
.red{fill:#e43b32;stroke:#a91e18;stroke-width:4}
.blue{fill:#1976d2;stroke:#0d47a1;stroke-width:4}
.piece{cursor:grab}
.label{font-size:18px;font-weight:800;text-anchor:middle}
.redtxt{fill:#d33129}.bluetxt{fill:#1467bd}
.pocketlabel{fill:#777;font-size:14px;font-weight:700;text-anchor:middle}
.bar{display:flex;justify-content:center;align-items:center;gap:24px;flex-wrap:wrap;margin-top:15px}
button{appearance:none;border:0;background:#171717;color:#fff;border-radius:14px;padding:12px 22px;font-size:18px;font-weight:800}
#status{font-size:19px;font-weight:800;min-width:130px}
.help{font-size:14px;color:#777;margin-top:10px;line-height:1.4}
.win{fill:#16833b;font-size:28px;font-weight:900;text-anchor:middle;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Byt sida</h1>
  <p class="sub">Flytta alla röda till höger och alla blå till vänster.</p>

  <div class="card">
    <svg id="game" viewBox="0 0 720 620" aria-label="Spelplan med enkel passage och mötesficka">
      <text x="125" y="52" class="label redtxt">RÖD START</text>
      <text x="595" y="52" class="label bluetxt">BLÅ START</text>

      <!-- Enkelspårig mittpassage + en övre mötesficka -->
      <path class="board" d="
        M55 85
        L205 85
        L205 275
        L300 275
        L300 105
        L420 105
        L420 275
        L515 275
        L515 85
        L665 85
        L665 535
        L515 535
        L515 345
        L205 345
        L205 535
        L55 535
        Z"/>

      <text x="360" y="142" class="pocketlabel">MÖTESFICKA</text>

      <g id="pieces">
        <circle class="piece red" data-color="red" cx="120" cy="145" r="28"/>
        <circle class="piece red" data-color="red" cx="120" cy="310" r="28"/>
        <circle class="piece red" data-color="red" cx="120" cy="475" r="28"/>

        <circle class="piece blue" data-color="blue" cx="600" cy="145" r="28"/>
        <circle class="piece blue" data-color="blue" cx="600" cy="310" r="28"/>
        <circle class="piece blue" data-color="blue" cx="600" cy="475" r="28"/>
      </g>

      <text id="win" x="360" y="595" class="win">🎉 KLART!</text>
    </svg>
  </div>

  <div class="bar">
    <button id="reset" type="button">Börja om</button>
    <span id="status">Drag: 0</span>
  </div>
  <div class="help">Mittgången är bara en pjäs bred. Använd mötesfickan upptill för att släppa förbi motståndarfärgen.</div>
</div>

<script>
(function(){
  const svg=document.getElementById('game');
  const pieces=[...document.querySelectorAll('.piece')];
  const status=document.getElementById('status');
  const win=document.getElementById('win');
  const reset=document.getElementById('reset');

  const R=28;
  const STARTS=[
    [120,145],[120,310],[120,475],
    [600,145],[600,310],[600,475]
  ];

  let active=null, dx=0, dy=0, moves=0, lastValid=null;

  // Själva spelområdets geometri.
  // Sidokamrarna är rymliga, mittgången är bara 70 px hög
  // och mötesfickan går upp från mitten.
  function insideBoard(x,y){
    const left  = x>=55  && x<=205 && y>=85  && y<=535;
    const right = x>=515 && x<=665 && y>=85  && y<=535;
    const hall  = x>=205 && x<=515 && y>=275 && y<=345;
    const bay   = x>=300 && x<=420 && y>=105 && y<=345;
    return left || right || hall || bay;
  }

  function circleInside(x,y){
    if(!insideBoard(x,y)) return false;
    for(let i=0;i<32;i++){
      const a=Math.PI*2*i/32;
      if(!insideBoard(x+Math.cos(a)*R, y+Math.sin(a)*R)) return false;
    }
    return true;
  }

  function collides(el,x,y){
    for(const p of pieces){
      if(p===el) continue;
      const px=+p.getAttribute('cx');
      const py=+p.getAttribute('cy');
      if(Math.hypot(px-x,py-y) < R*2+3) return true;
    }
    return false;
  }

  // Viktigt: vi testar HELA vägen mellan gammal och ny position.
  // Då kan en pjäs inte "hoppa över" en annan om fingret rör sig snabbt.
  function pathIsClear(el, x0,y0,x1,y1){
    const dist=Math.hypot(x1-x0,y1-y0);
    const steps=Math.max(1,Math.ceil(dist/5));
    for(let i=1;i<=steps;i++){
      const t=i/steps;
      const x=x0+(x1-x0)*t;
      const y=y0+(y1-y0)*t;
      if(!circleInside(x,y) || collides(el,x,y)) return false;
    }
    return true;
  }

  function point(evt){
    const touch=(evt.touches&&evt.touches[0]) ||
                (evt.changedTouches&&evt.changedTouches[0]) || evt;
    const pt=svg.createSVGPoint();
    pt.x=touch.clientX; pt.y=touch.clientY;
    const m=svg.getScreenCTM();
    return m ? pt.matrixTransform(m.inverse()) : {x:0,y:0};
  }

  function startDrag(evt){
    const target=evt.target;
    if(!target.classList.contains('piece')) return;
    evt.preventDefault();
    const p=point(evt);
    active=target;
    const x=+active.getAttribute('cx');
    const y=+active.getAttribute('cy');
    active._sx=x; active._sy=y;
    dx=x-p.x; dy=y-p.y;
    lastValid={x,y};
    active.parentNode.appendChild(active);
  }

  function drag(evt){
    if(!active) return;
    evt.preventDefault();

    const p=point(evt);
    const nx=p.x+dx, ny=p.y+dy;
    const ox=+active.getAttribute('cx');
    const oy=+active.getAttribute('cy');

    if(pathIsClear(active,ox,oy,nx,ny)){
      active.setAttribute('cx',nx);
      active.setAttribute('cy',ny);
      lastValid={x:nx,y:ny};
    }
  }

  function endDrag(){
    if(!active) return;
    const x=+active.getAttribute('cx');
    const y=+active.getAttribute('cy');
    if(Math.hypot(x-active._sx,y-active._sy)>4) moves++;
    active=null;
    lastValid=null;
    checkWin();
  }

  function checkWin(){
    const reds=pieces.filter(p=>p.dataset.color==='red');
    const blues=pieces.filter(p=>p.dataset.color==='blue');

    const redDone=reds.every(p=>+p.getAttribute('cx')>515);
    const blueDone=blues.every(p=>+p.getAttribute('cx')<205);
    const done=redDone && blueDone;

    status.textContent=done ? `Klart på ${moves} drag!` : `Drag: ${moves}`;
    win.style.display=done ? 'block' : 'none';
  }

  function restart(){
    pieces.forEach((p,i)=>{
      p.setAttribute('cx',STARTS[i][0]);
      p.setAttribute('cy',STARTS[i][1]);
    });
    moves=0; active=null; lastValid=null;
    status.textContent='Drag: 0';
    win.style.display='none';
  }

  svg.addEventListener('mousedown',startDrag);
  window.addEventListener('mousemove',drag);
  window.addEventListener('mouseup',endDrag);

  svg.addEventListener('touchstart',startDrag,{passive:false});
  svg.addEventListener('touchmove',drag,{passive:false});
  svg.addEventListener('touchend',endDrag,{passive:false});
  svg.addEventListener('touchcancel',endDrag,{passive:false});

  reset.addEventListener('click',restart);
})();
</script>
</body>
</html>
