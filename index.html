<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Byt sida</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f4f1;color:#171717}
body{display:flex;justify-content:center;align-items:center;padding:24px 12px}
.wrap{width:min(760px,96vw);text-align:center}
h1{font-size:clamp(30px,7vw,46px);margin:0 0 6px}
.sub{font-size:clamp(16px,4vw,22px);color:#6b6b6b;margin:0 0 16px}
.card{background:#fff;border-radius:24px;padding:8px;box-shadow:0 12px 36px rgba(0,0,0,.08)}
svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.board{fill:#fafafa;stroke:#171717;stroke-width:7;stroke-linejoin:round}
.red{fill:#e43b32;stroke:#a91e18;stroke-width:4}
.blue{fill:#1976d2;stroke:#0d47a1;stroke-width:4}
.piece{cursor:grab}
.piece:active{cursor:grabbing}
.label{font-size:18px;font-weight:800;text-anchor:middle}
.redtxt{fill:#d33129}.bluetxt{fill:#1467bd}
.bar{display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;margin-top:16px}
button{appearance:none;border:0;background:#171717;color:#fff;border-radius:14px;padding:12px 22px;font-size:18px;font-weight:800}
#status{font-size:19px;font-weight:800;min-width:130px}
.help{font-size:14px;color:#777;margin-top:12px;line-height:1.4}
.win{fill:#16833b;font-size:28px;font-weight:900;text-anchor:middle;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Byt sida</h1>
  <p class="sub">Flytta alla röda till höger och alla blå till vänster.</p>

  <div class="card">
    <svg id="game" viewBox="0 0 720 620" role="img" aria-label="Spelplan med tre röda och tre blå pjäser">
      <text x="130" y="52" class="label redtxt">RÖD START</text>
      <text x="590" y="52" class="label bluetxt">BLÅ START</text>

      <!-- Spelplanen finns direkt i HTML, så den syns även om förhandsvisningen blockerar JavaScript -->
      <path class="board" d="
        M55 85
        L205 85 L205 245
        L270 245 L270 85
        L450 85 L450 245
        L515 245 L515 85
        L665 85 L665 535
        L515 535 L515 375
        L205 375 L205 535
        L55 535 Z"/>

      <g id="pieces">
        <circle class="piece red" data-color="red" cx="110" cy="145" r="29"/>
        <circle class="piece red" data-color="red" cx="110" cy="310" r="29"/>
        <circle class="piece red" data-color="red" cx="110" cy="475" r="29"/>
        <circle class="piece blue" data-color="blue" cx="610" cy="145" r="29"/>
        <circle class="piece blue" data-color="blue" cx="610" cy="310" r="29"/>
        <circle class="piece blue" data-color="blue" cx="610" cy="475" r="29"/>
      </g>

      <text id="win" x="360" y="595" class="win">🎉 KLART!</text>
    </svg>
  </div>

  <div class="bar">
    <button id="reset" type="button">Börja om</button>
    <span id="status">Drag: 0</span>
  </div>
  <div class="help">Tips: öppna filen i Safari om iPhones förhandsvisning inte låter dig dra pjäserna.</div>
</div>

<script>
(function(){
  var svg=document.getElementById('game');
  var pieces=[].slice.call(document.querySelectorAll('.piece'));
  var status=document.getElementById('status');
  var win=document.getElementById('win');
  var reset=document.getElementById('reset');
  var radius=29, active=null, dx=0, dy=0, moves=0;
  var starts=[
    [110,145],[110,310],[110,475],
    [610,145],[610,310],[610,475]
  ];

  function inside(x,y){
    if(x>=55&&x<=205&&y>=85&&y<=535)return true;
    if(x>=515&&x<=665&&y>=85&&y<=535)return true;
    if(x>=190&&x<=530&&y>=245&&y<=375)return true;
    if(x>=205&&x<=270&&y>=85&&y<=245)return true;
    if(x>=450&&x<=515&&y>=85&&y<=245)return true;
    return false;
  }

  function validCircle(x,y){
    if(!inside(x,y))return false;
    for(var i=0;i<24;i++){
      var a=Math.PI*2*i/24;
      if(!inside(x+Math.cos(a)*radius,y+Math.sin(a)*radius))return false;
    }
    return true;
  }

  function overlaps(el,x,y){
    for(var i=0;i<pieces.length;i++){
      var p=pieces[i];
      if(p===el)continue;
      var px=parseFloat(p.getAttribute('cx'));
      var py=parseFloat(p.getAttribute('cy'));
      var ddx=px-x, ddy=py-y;
      if(Math.sqrt(ddx*ddx+ddy*ddy)<radius*2+4)return true;
    }
    return false;
  }

  function point(evt){
    var touch=evt.touches&&evt.touches.length?evt.touches[0]:
              evt.changedTouches&&evt.changedTouches.length?evt.changedTouches[0]:evt;
    var pt=svg.createSVGPoint();
    pt.x=touch.clientX;pt.y=touch.clientY;
    var m=svg.getScreenCTM();
    return m?pt.matrixTransform(m.inverse()):{x:0,y:0};
  }

  function startDrag(evt){
    var target=evt.target;
    if(!target.classList.contains('piece'))return;
    evt.preventDefault();
    var p=point(evt);
    active=target;
    active._sx=parseFloat(active.getAttribute('cx'));
    active._sy=parseFloat(active.getAttribute('cy'));
    dx=active._sx-p.x;dy=active._sy-p.y;
  }

  function drag(evt){
    if(!active)return;
    evt.preventDefault();
    var p=point(evt),x=p.x+dx,y=p.y+dy;
    if(validCircle(x,y)&&!overlaps(active,x,y)){
      active.setAttribute('cx',x);
      active.setAttribute('cy',y);
    }
  }

  function endDrag(evt){
    if(!active)return;
    var x=parseFloat(active.getAttribute('cx'));
    var y=parseFloat(active.getAttribute('cy'));
    var ddx=x-active._sx,ddy=y-active._sy;
    if(Math.sqrt(ddx*ddx+ddy*ddy)>4)moves++;
    active=null;
    check();
  }

  function check(){
    var ok=true;
    for(var i=0;i<pieces.length;i++){
      var p=pieces[i],x=parseFloat(p.getAttribute('cx')),col=p.getAttribute('data-color');
      if(col==='red' && x<515)ok=false;
      if(col==='blue' && x>205)ok=false;
    }
    status.textContent=ok?'Klart på '+moves+' drag!':'Drag: '+moves;
    win.style.display=ok?'block':'none';
  }

  function restart(){
    for(var i=0;i<pieces.length;i++){
      pieces[i].setAttribute('cx',starts[i][0]);
      pieces[i].setAttribute('cy',starts[i][1]);
    }
    moves=0;active=null;win.style.display='none';status.textContent='Drag: 0';
  }

  svg.addEventListener('mousedown',startDrag);
  window.addEventListener('mousemove',drag);
  window.addEventListener('mouseup',endDrag);

  svg.addEventListener('touchstart',startDrag,{passive:false});
  svg.addEventListener('touchmove',drag,{passive:false});
  svg.addEventListener('touchend',endDrag,{passive:false});

  reset.addEventListener('click',restart);
})();
</script>
</body>
</html>
